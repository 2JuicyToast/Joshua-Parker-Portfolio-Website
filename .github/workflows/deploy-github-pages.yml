name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-branch
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages Viewer
        run: pnpm --filter @workspace/joshua-parker-portfolio run build:github-pages

      - name: Verify GitHub Pages Viewer artifact
        run: pnpm --filter @workspace/joshua-parker-portfolio run verify:github-pages

      - name: Stage static Viewer files
        run: |
          mkdir -p "$RUNNER_TEMP/portfolio-viewer"
          cp -a artifacts/joshua-parker-portfolio/dist/public/. "$RUNNER_TEMP/portfolio-viewer/"
          cp artifacts/joshua-parker-portfolio/scripts/verify-github-pages-deployment.mjs "$RUNNER_TEMP/verify-github-pages-deployment.mjs"

      - name: Publish website files to gh-pages
        env:
          SITE_DIRECTORY: ${{ runner.temp }}/portfolio-viewer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi

          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp -a "$SITE_DIRECTORY/." .
          git add --all

          if git diff --cached --quiet; then
            echo "The gh-pages branch already contains the current Viewer files."
          else
            git commit -m "Deploy static portfolio Viewer"
            git push origin gh-pages
          fi

      - name: Verify deployed portfolio routes
        env:
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node "$RUNNER_TEMP/verify-github-pages-deployment.mjs"
