name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Pages is configured for Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response_file="$(mktemp)"
          http_status="$(curl -sS \
            -o "$response_file" \
            -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"

          if [ "$http_status" != "200" ]; then
            echo "::error::Could not read GitHub Pages configuration (HTTP $http_status). Confirm Pages is enabled and this workflow has Pages write permission."
            exit 1
          fi

          build_type="$(jq -r '.build_type // "unknown"' "$response_file")"
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages is configured for '$build_type', not GitHub Actions. Before publishing, open repository Settings → Pages → Build and deployment → Source and choose GitHub Actions."
            exit 1
          fi

          echo "GitHub Pages is configured for Actions."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages Viewer
        run: pnpm --filter @workspace/joshua-parker-portfolio run build:github-pages

      - name: Verify GitHub Pages Viewer artifact
        run: pnpm --filter @workspace/joshua-parker-portfolio run verify:github-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/joshua-parker-portfolio/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
